# Render Blueprint: deploys the API and the static site together.
# Render dashboard → New → Blueprint → pick this repo.
# The two public URLs are set explicitly: Render's `fromService … host` gives the *internal*
# hostname, which browsers can't reach. Update both values if a service is renamed.
services:
  - type: web
    name: karnatakamatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # the website, and the Android app (Capacitor serves it from https://localhost)
      - key: ALLOWED_ORIGINS
        value: https://karnatakamatch.onrender.com,https://localhost

  - type: web
    name: karnatakamatch
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # client-side routes (/birth-chart/result?…) must load the app on refresh
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://karnatakamatch-api.onrender.com
